# Playwright E2E Test Workflow
#
# Triggers:
#   - pull_request (main): smoke + auth tiers — merge-blocking
#   - schedule (nightly 03:00 UTC): full suite — smoke + auth + flows
#   - workflow_dispatch: configurable suite and target URL
#
# PR and nightly runs use disposable local Supabase, not repository secrets.
# Secrets below are only used by manual runs with an explicit deployed base_url:
#   E2E_BASE_URL                   — Target app URL (Vercel preview or dev deployment)
#   E2E_SUPABASE_URL               — Dev Supabase project URL (NEXT_PUBLIC_SUPABASE_URL)
#   E2E_SUPABASE_ANON_KEY          — Dev Supabase anon/publishable key
#   E2E_SUPABASE_SERVICE_ROLE_KEY  — Dev Supabase service-role key (fixture setup/teardown)
#   E2E_TEST_USER_EMAIL            — Seed test user email (for pre-seeded auth flows)
#   E2E_TEST_USER_PASSWORD         — Seed test user password

name: Playwright E2E Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

  schedule:
    # 03:00 UTC nightly
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - smoke
          - auth
          - flows
          - all
      base_url:
        description: 'Explicit hosted staging URL (blank runs this checkout locally)'
        required: false
        default: ''

# Cancel in-progress runs on new PR pushes; let nightly/manual runs finish.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/frontend

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # e2e-smoke: PR merge-blocking job — smoke + auth tiers
  # ──────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E — Smoke + Auth (PR)
    # Playwright 1.59 does not support Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start isolated test database
        timeout-minutes: 10
        uses: ./.github/actions/e2e-stack

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Run smoke + auth tests
        run: npx playwright test --grep "@smoke|@auth" --project=chromium --trace=off --reporter=line
        env:
          CI: true

      - name: Stop isolated test database
        if: always()
        working-directory: .
        run: supabase stop --no-backup

  # ──────────────────────────────────────────────────────────────────────────
  # e2e-full: Nightly full suite — smoke + auth + flows
  # ──────────────────────────────────────────────────────────────────────────
  e2e-full:
    name: E2E — Full Suite (Nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start isolated test database
        timeout-minutes: 10
        uses: ./.github/actions/e2e-stack

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Run full suite
        run: npx playwright test --grep "@smoke|@auth|@flow" --project=chromium --trace=off --reporter=line
        env:
          CI: true

      - name: Stop isolated test database
        if: always()
        working-directory: .
        run: supabase stop --no-backup

      - name: Create GitHub issue on nightly failure (deduped)
        uses: actions/github-script@v9.0.0
        if: failure()
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);

            // Search for existing open issues with the nightly-failure title prefix.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-testing',
              per_page: 50,
            });

            const dupes = openIssues
              .filter(i => i.title.startsWith('🔴 E2E nightly suite failed'))
              .sort((a, b) => b.number - a.number);

            if (dupes.length > 0) {
              // Append a comment on the most recent open issue instead of filing a new one.
              const existing = dupes[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  `Nightly run for **${today}** also failed — see ${runUrl}`,
                  '',
                  `last-failure: ${today}`,
                ].join('\n'),
              });
              console.log(`Appended comment to existing issue #${existing.number}`);
            } else {
              // No open issue found — create a fresh one.
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 E2E nightly suite failed — ${today}`,
                body: [
                  '## Nightly E2E Suite Failure',
                  '',
                  `The nightly Playwright full suite failed on **${today}**.`,
                  '',
                  `**Run:** ${runUrl}`,
                  '',
                  '### Next steps',
                  '1. Check the masked browser-test step output in the run above (raw artifacts are disabled).',
                  '2. Identify flaky tests vs genuine regressions.',
                  '3. Tag this issue with the affected tier (`@smoke`, `@auth`, `@flow`).',
                  '',
                  '/cc @cohenjo',
                ].join('\n'),
                labels: ['e2e-testing', 'bug'],
              });
            }

  # ──────────────────────────────────────────────────────────────────────────
  # e2e-dispatch: Manual on-demand run with configurable suite + URL
  # ──────────────────────────────────────────────────────────────────────────
  e2e-dispatch:
    name: E2E — Manual (${{ inputs.suite || 'all' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard — required secrets must be present
        if: inputs.base_url != ''
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          missing=()
          [ -z "$E2E_SUPABASE_URL" ]               && missing+=(E2E_SUPABASE_URL)
          [ -z "$E2E_SUPABASE_ANON_KEY" ]          && missing+=(E2E_SUPABASE_ANON_KEY)
          [ -z "$E2E_SUPABASE_SERVICE_ROLE_KEY" ]  && missing+=(E2E_SUPABASE_SERVICE_ROLE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            for s in "${missing[@]}"; do
              echo "::error::Required secret '$s' is empty or not set. Add it under Settings → Secrets → Actions."
            done
            exit 1
          fi
          echo "✅ All required E2E secrets present."

      - name: Start isolated test database
        timeout-minutes: 10
        if: inputs.base_url == ''
        uses: ./.github/actions/e2e-stack

      - name: Configure explicit deployed target
        if: inputs.base_url != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const names = ['NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_ANON_KEY',
            'SUPABASE_SERVICE_ROLE_KEY', 'BASE_URL'];
          for (const name of names) {
            const value = process.env[name];
            if (!value || /[\r\n]/.test(value)) throw new Error(`Invalid ${name}`);
          }
          for (const name of ['NEXT_PUBLIC_SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY']) {
            console.error(`::add-mask::${process.env[name].replaceAll('%', '%25')}`);
          }
          if (!['https:', 'http:'].includes(new URL(process.env.BASE_URL).protocol)) {
            throw new Error('Target must be an HTTP(S) URL');
          }
          for (const name of names) console.log(`${name}=${process.env[name]}`);
          NODE

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Resolve grep pattern
        id: grep
        shell: bash
        # Security: inputs.suite is passed via env var (not interpolated into shell body)
        # to prevent shell-injection. Ref: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            smoke)  echo "pattern=@smoke"           >> "$GITHUB_OUTPUT" ;;
            auth)   echo "pattern=@auth"            >> "$GITHUB_OUTPUT" ;;
            flows)  echo "pattern=@flow"            >> "$GITHUB_OUTPUT" ;;
            *)      echo "pattern=@smoke|@auth|@flow" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run ${{ inputs.suite || 'all' }} tests
        # Security: steps output is passed via env var (not interpolated into shell body)
        # to prevent shell-injection if the pattern value were ever tainted.
        run: npx playwright test --grep "$GREP_PATTERN" --project=chromium --trace=off --reporter=line
        env:
          CI: true
          GREP_PATTERN: ${{ steps.grep.outputs.pattern }}

      - name: Stop isolated test database
        if: always() && inputs.base_url == ''
        working-directory: .
        run: supabase stop --no-backup
