name: Isolated E2E database
description: Start disposable Supabase with repository migrations, without hosted credentials
runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@v1
      with:
        version: 2.95.4
    - name: Start Supabase and apply migrations
      shell: bash
      env:
        # GHCR and public ECR both returned anonymous-pull quota errors.
        SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      run: |
        supabase start -x studio,postgres-meta,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
    - name: Export local test credentials
      shell: bash
      run: |
        supabase status -o json | node .github/scripts/e2e-env.cjs >> "$GITHUB_ENV"
